name: Dependency Submission

# Replaces GitHub's built-in "Automatic Dependency Submission" feature, which
# runs Gradle without exporting GITHUB_TOKEN to the build. The server module
# resolves xyz.ksharma.krail:api-proto from GitHub Packages (see
# settings.gradle.kts), so that token-less build always 401s. This workflow
# does the same job with credentials wired in.
#
# The built-in feature must be turned OFF (repo Settings -> Code security ->
# Dependency graph -> Automatic dependency submission) or both will run and
# the built-in one will keep failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
