name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # `update-type` can come back null. Dependabot's commit trailer sometimes
      # carries only dependency-name / dependency-version / dependency-type /
      # dependency-group, with no update-type and no previous version, leaving
      # fetch-metadata nothing to compute a semver level from. The old gate
      # tested `!= semver-major`, and null != major, so those PRs were waved
      # through regardless of content — that is how a major wire-runtime bump
      # (5.5.1 -> 6.4.5) got auto-merge enabled on PR #93.
      #
      # This is an allowlist: merge only when every entry is EXPLICITLY tagged
      # patch or minor. Missing, null, or unrecognised update types block.
      #
      # Grouped PRs are NOT categorically excluded — when a group's members
      # share a level, fetch-metadata reports it and the group auto-merges
      # normally (observed on the all-patch codeql-action group, PR #95).
      # Only genuinely unclassifiable PRs fall through to a human.
      - name: Gate on update type (group-aware)
        id: gate
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          allow=$(jq -r '
            if (type == "array")
               and (length > 0)
               and (all(.[]; .updateType == "version-update:semver-patch"
                             or .updateType == "version-update:semver-minor"))
            then "true" else "false" end
          ' <<< "${UPDATES:-[]}")
          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "update-type=${{ steps.metadata.outputs.update-type }} group=${{ steps.metadata.outputs.dependency-group }} allow=$allow"

      - name: Enable auto-merge (patch/minor only, waits on required checks)
        if: steps.gate.outputs.allow == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # pull_request_target re-runs on `synchronize`, so a rebase of an
      # already-open PR would otherwise leave a previously-enabled auto-merge
      # in place even after it stops qualifying.
      - name: Disable auto-merge when it does not qualify
        if: steps.gate.outputs.allow != 'true'
        run: gh pr merge --disable-auto "$PR_URL" || true
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
